name: Form build

# docs/index.html is generated but committed, because Pages serves it straight from
# main/docs — so a template edit without a rebuild ships a stale form to the league.
# This verifies rather than auto-commits: CI pushing to main would change the live
# page with nobody having looked at it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the form from the template
        run: python3 scripts/build_form.py

      - name: Committed build must match the template
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Built output matches the template."
          else
            git diff --stat -- docs/index.html
            echo "::error file=form/trade_form.template.html::The committed form is stale. Run 'python3 scripts/build_form.py' and commit docs/index.html."
            exit 1
          fi

      - name: No ESPN owner ids anywhere in the repo
        run: |
          # espn_owner_id is a manager's SWID cookie, and this repo is public so
          # Pages can serve it. This stops one coming back by any route.
          if git grep -InE '\{[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\}' -- .; then
            echo "::error::An ESPN owner GUID (a manager's SWID) is committed. Remove it before pushing — see fetch_league_data.py."
            exit 1
          fi
          echo "No owner ids found."
