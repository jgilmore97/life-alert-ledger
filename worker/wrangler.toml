name = "life-alert-ledger"
main = "src/worker.js"
compatibility_date = "2026-01-15"

# Created with:  wrangler d1 create life-alert-ledger
# Paste the database_id it prints into the line below.
[[d1_databases]]
binding = "LEDGER"
database_name = "life-alert-ledger"
database_id = "51b0e3a4-02bc-4c32-9986-abe1fdba3495"

[vars]
# Comma-separated origins allowed to call this worker. "*" allows any origin —
# acceptable here only because every write requires the league password.
ALLOWED_ORIGINS = "*"

# The league password is a SECRET, never a var. Set it with:
#   wrangler secret put LEAGUE_PASSWORD
